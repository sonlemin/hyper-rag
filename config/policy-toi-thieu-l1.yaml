# Cấu hình 4 của FR-28: **tối thiểu L1** - "không chặn gì, chỉ che" (PRD 5.3).
#
# **Phép biến đổi sinh ra file này: `L0 -> L1` trên `config/policy-day-du.yaml`,
# và mọi ô vừa lên L1 che cả 7 slot khai được.** Ô đang L1 hay L2 giữ nguyên,
# `scopes` giữ nguyên. Che cả 7 slot chứ không che một tập nhỏ vì luận điểm của
# cấu hình này là "biết tồn tại nhưng không đọc được gì": một ô mới lên L1 mà
# còn hở slot nào thì nó không còn là đầu kia của phổ so với cấu hình 2.
#
# Ba ô đổi, tất cả ở `tech_support`: `log`, `cmdb`, `bi_mat_ha_tang`. `devops`
# không có ô L0 nào ở cấu hình 3 nên nó giống hệt cấu hình 3 - đó là hệ quả của
# phép biến đổi, không phải một chỗ quên.
#
# **Vì vậy luận điểm "biết tồn tại nhưng không đọc được gì" chỉ đúng trọn với
# `tech_support`.** Ở `devops`, ô `bi_mat_ha_tang` giữ nguyên tập che hai slot
# của cấu hình 3, tức 5 trong 7 slot còn hở - `devops` đọc được `subject`,
# `symptom`, `cause`, `condition`, `time` của sổ tay hạ tầng ở cả bốn cấu hình.
# Đọc cột `devops` của file này như "đầu kia của phổ tiết lộ" là đọc sai; đầu
# kia của phổ đo được ở cột `tech_support`. Lý do `devops` giữ L1 chứ không lên
# L2 ở ô ấy nằm ở ADR-014, quyết định 1.
#
# Cấu hình này là **điểm so sánh, không phải cấu hình vận hành**: nó không pass
# mô hình đe dọa (với RT-01/04/05 thì biết tồn tại đã là rò rỉ, quy tắc ĐG2), và
# nó mở đúng kênh RT-06 - một oracle tồn tại phổ quát lan ra toàn kho khi mọi
# thứ hiện dưới dạng placeholder. Nó chỉ chạy phần recall tất định của Đo 3,
# không vào Đo 2, để định lượng cái giá của việc giữ L0.
#
# `masked_slots` vẫn phải lồng nhau theo hạng (điều kiện (2) của AD-5), và ở đây
# nó lồng tới tận cùng: [source, remediation] ⊆ [cause, source, remediation]
# ⊆ [subject, cause, source, remediation] ⊆ cả 7 slot.
#
# Ba vai của story 4.5 đi qua đúng phép biến đổi ấy. `sale_ba` và `admin` L0
# toàn phần ở cấu hình 3 nên **cả 13 ô** lên L1 và **cả 13 ô** che cả 7 slot;
# đó là hai cột thuần nhất của cấu hình này và cũng là hai cột minh họa rõ nhất
# luận điểm "biết tồn tại nhưng không đọc được gì". `truong_nhom` L2 toàn phần
# nên nó giống hệt cấu hình 3, cùng lý do mà `devops` giống hệt.
