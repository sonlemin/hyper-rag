# Cấu hình 1 của FR-28: **tắt phân quyền**, cho trần recall của Đo 3 (PRD 5.3).
# Cùng file này là đối chứng "chính hệ thống khi tắt cơ chế phân quyền" của Đo 1
# (PRD 5.1) - một cấu hình, hai chỗ dùng, nên không có hai bản trôi dạt nhau.
#
# **Phép biến đổi sinh ra file này: mọi ô lên L2 trên cả 13 loại *và* cả 3 scope.**
# Tắt phân quyền vẫn là một bảng chính sách chứ không phải một nhánh code (PRD
# 5.3 nói thẳng điều đó): không có cờ `tat_phan_quyen` nào trong hệ, chỉ có một
# file mà mọi vai thấy mọi thứ.
#
# Vì sao phải mở **cả scope** chứ không chỉ cột mức: trần recall là trần trên
# *toàn bộ* nhãn truy hồi vàng, và nhãn có cặp ở `khach_hang_b` - scope mà không
# vai nào chạm ở ba cấu hình kia. Giữ nguyên `scopes` thì "trần" của cấu hình 1
# vẫn bỏ sót trọn kịch bản 3, tức nó không còn là trần.
#
# Hệ quả phải nhớ khi đọc số: file này **không pass mô hình đe dọa** và không bao
# giờ là cấu hình vận hành. Nó là mốc trên của phổ, cùng vai trò với
# `policy-toi-thieu-l1.yaml` ở đầu kia.
#
# 3 scope × 13 loại = **39 khóa lọc mỗi vai mỗi namespace**, dưới trần 50 của
# AD-4 nhưng là con số cao nhất trong bốn cấu hình - chỗ trần đó gần bị chạm
# nhất, và là lý do validator đếm rồi cảnh báo thay vì im lặng. Ba vai của story
# 4.5 thêm ba hàng 39 khóa nữa; trần của AD-4 là trần **mỗi vai**, nên con số
# cao nhất vẫn là 39.
#
# Phép biến đổi áp cho cả năm vai, kể cả `admin` và `sale_ba` vốn L0 toàn phần ở
# cấu hình 3: "tắt phân quyền" nghĩa là mọi vai thấy mọi thứ, và chừa một vai
# lại là cấu hình này không còn là trần recall.
