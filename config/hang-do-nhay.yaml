# Hạng độ nhạy của từng loại nội dung (story 2.1, FR-11).
#
# Bảng này trả lời đúng một câu hỏi: khi cùng một id xuất hiện ở hai tài liệu
# *cùng scope* nhưng khác loại nội dung, loại nào là "hạn chế nhất". Số lớn hơn
# là hạn chế hơn. Nó không thay bảng chính sách: mức tiết lộ L0/L1/L2 của từng
# vai vẫn tính lúc truy vấn từ `config/policy-*.yaml`, còn đây là thứ tự dùng
# lúc *ghi*, để khóa của một artifact đa nguồn xác định được.
#
# Khoảng cách 10 giữa hai hạng là chỗ chèn một loại nội dung mới vào giữa mà
# không phải đánh số lại cả bảng. Hai loại nội dung **không được cùng hạng**:
# khi đó "hạn chế nhất" không xác định, và loader từ chối cả file.
#
# Đánh đổi của luật đó, ghi ra để lần sau không ai tưởng nó miễn phí: nó chặt
# hơn thứ luật hợp nhất thật sự cần. Phép so hạng chỉ xảy ra giữa hai khóa
# *cùng scope*, nên hai loại nội dung ngang độ nhạy mà không bao giờ đụng nhau
# vẫn bị bắt phải khai hai số khác nhau - tức thứ tự giữa chúng là một khẳng
# định không ai muốn đưa ra. Đổi lại là một file không có ca nhập nhằng nào và
# một thông điệp lỗi ở đúng chỗ người sửa file đang nhìn. Nới luật này (chỉ cấm
# cùng hạng khi hai loại thật sự gặp nhau) cần biết trước tập cặp có thể gặp,
# tức cần validator đơn điệu của AD-5 - khoản nợ có địa chỉ story 3.2.
#
# **Đóng băng trước ingest.** Khóa quyền của mọi mục đã nạp được tính bằng đúng
# bảng này, nên đổi một hạng sau khi đã nạp là mọi khóa đã ghi có thể sai - chỉ
# re-ingest chữa được (story 2.3). Thêm một loại nội dung mới thì chỉ ảnh hưởng
# dữ liệu nạp sau, nhưng vẫn phải quyết trước khi lô đầu tiên mang loại đó chạy.
#
# Loại nội dung không có trong bảng là `SensitivityRankUnknown`, từ chối cả lô.
# **Thứ tự 13 hạng (story 2.8).** Ba số 10/20/30 là số đã đóng băng từ story
# 2.1: 10 tài liệu bộ vàng đã nạp bằng đúng ba số đó, nên đổi chúng là re-ingest
# cả bộ vàng. Mười loại mới chỉ chèn vào khoảng trống giữa và quanh chúng, nên
# khóa quyền đã ghi của bộ vàng không đổi; chỉ `version` sha256 của file đổi, và
# đó đúng là thứ audit cần để biết một mục được tính bằng bảng nào.
#
# Thứ tự chọn để bản đồ ACL của PRD addendum A4 (SOP toàn công ty - runbook
# DevOps - lịch sử sự cố team + Tech Support - CMDB và log nhóm hạ tầng -
# postmortem hạn chế) diễn đạt được thành một bảng chính sách **đơn điệu** theo
# AD-5 (hạng cao hơn thì mức tiết lộ không được cao hơn). Đọc thử với
# `tech_support`: L2 từ `faq` tới `runbook`, L1 từ `known_issue` tới
# `postmortem`, L0 từ `log` trở lên - một chuỗi không tăng. Với `devops`: L2 tới
# `cmdb`, L1 ở `bi_mat_ha_tang`. Cả hai đọc được mà không phải đảo hạng nào, nên
# story 3.2 dựng bảng đầy đủ mà không phải re-ingest corpus.
#
# Bảng chính sách đầy đủ là việc của story 3.2. Loại nội dung chưa khai trong
# bảng chính sách hiện hành là fail-closed L0 (`core.policy.RolePolicy.level`),
# đó là trạng thái đúng cho tới khi 3.2 khai đủ.
version: 1
ranks:
  # Hỏi đáp thường gặp, viết cho mọi người đọc: hạn chế thấp nhất.
  faq: 2
  # Tài liệu sản phẩm, mô tả dịch vụ đang chạy cho khách và cho nội bộ.
  tai_lieu_san_pham: 4
  # SOP đã duyệt, quy trình chuẩn toàn công ty (A4: L2 toàn công ty).
  sop: 6
  # Hướng dẫn tự khắc phục theo triệu chứng, mức người dùng cuối.
  troubleshooting: 8
  # Quy trình vận hành của nhóm DevOps, có thao tác trên hệ sản xuất.
  runbook: 10
  # Lỗi đã biết chưa có bản vá: hữu ích cho hỗ trợ, nhưng là bản đồ điểm yếu.
  known_issue: 12
  # Vòng đời một ticket: ai mở, ai xử lý, kết thúc thế nào.
  vong_doi_ticket: 14
  # Cảnh báo giám sát: ngưỡng, kênh nhận, hệ thống nào đang yếu.
  canh_bao: 16
  # Báo cáo sự cố mang nguyên nhân, mốc thời gian và người xử lý.
  bao_cao_su_co: 20
  # Postmortem: phân tích sâu sau sự cố, nêu cả lỗi quy trình và lỗi người.
  postmortem: 22
  # Log hệ thống, nguyên văn dòng nhật ký (A4: nhóm hạ tầng).
  log: 24
  # CMDB: sơ đồ tài sản, phiên bản, phụ thuộc - bản đồ tấn công của hệ.
  cmdb: 26
  # Sổ tay hạ tầng, khóa quản trị, đường vào hệ thống: hạn chế nhất.
  bi_mat_ha_tang: 30
