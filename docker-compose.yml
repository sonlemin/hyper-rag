# Mot compose duy nhat cho moi moi truong (AD-11), khac nhau chi bang .env.
# Chay tren may chu (khong chay tren may dev):
#   docker compose --env-file .env --env-file .env.server up -d --build
# Tren laptop duong lui (R11):
#   docker compose --env-file .env --env-file .env.laptop up -d --build
# Kiem tra bien truoc khi len:
#   docker compose --env-file .env --env-file .env.server config --quiet
# Moi gia tri moi truong lay tu .env (secret) va .env.server/.env.laptop (tham so),
# khong hard-code. Chi cong 8000 (api) va 3000 (web) mo ra ngoai; cong 8100 (man-nap) chi bind
# loopback cua may chu, vao bang SSH tunnel; 7474/7687/6333/5432/11434 chi trong
# network noi bo cua compose. Profile local-llm (ollama) khong bat mac dinh.

name: hyper-rag-copilot

# Khoi build va khoi environment dung chung cho hai service chay ma Python cua du
# an (`api` va `man-nap`): cung image, cung bien, chi khac `command` va cong.
# Neo bang YAML anchor chu khong chep hai ban - hai ban thi mot lan them bien se
# vao mot cho va quen cho kia, va man nap se noi ValueError luc dung engine.
x-api-build: &api_build
  context: .
  dockerfile: api/Dockerfile

x-api-env: &api_env
  # Sau bien duoi day la nguon cua khoa cau hinh kho ma engine doc
  # (adapters/engine.py: BIEN_MOI_TRUONG -> field cua EngineACL ->
  # asdict(self) -> global_config cua adapter).
  # Doi ten mot bien o day ma quen doi o do co hai hau qua khac nhau:
  #  - NEO4J_URI, NEO4J_PASSWORD, QDRANT_URL: adapter noi ValueError ngay luc
  #    dung engine, noi dung ten khoa nao thieu (test ghim dieu do);
  #  - NEO4J_USERNAME, NEO4J_DATABASE, QDRANT_API_KEY, HYPER_RAG_WORKING_DIR:
  #    rot ve mac dinh im lang (neo4j / neo4j / khong api-key / thu muc mac
  #    dinh cua upstream), va rieng cai cuoi la kho KV di lac cho khong co
  #    volume.
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:?thieu NEO4J_PASSWORD trong .env}"
  # Neo4j Community chi co mot database. Truyen tuong minh de moi phien noi
  # ro no lam viec tren dau, thay vi dua vao mac dinh ngam cua driver.
  NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
  QDRANT_URL: "http://qdrant:6333"
  # Qdrant trong compose chay khong api-key (khong publish ra ngoai). Bien
  # rong tinh la chua dat, engine bo qua chu khong day mot chuoi rong xuong.
  QDRANT_API_KEY: "${QDRANT_API_KEY:-}"
  # Thu muc lam viec cua HyperGraphRAG: kho KV (text_chunks, full_docs) la
  # noi *duy nhat* giu khoa quyen cua chunk da nap, nen no phai nam tren
  # volume chu khong trong lop ghi cua container.
  HYPER_RAG_WORKING_DIR: "/data/hyper-rag"
  POSTGRES_HOST: "postgres"
  POSTGRES_USER: "${POSTGRES_USER:?thieu POSTGRES_USER trong .env.server/.env.laptop}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?thieu POSTGRES_PASSWORD trong .env}"
  POSTGRES_DB: "${POSTGRES_DB:?thieu POSTGRES_DB trong .env.server/.env.laptop}"
  # Khoa ky JWT (story 3.1). `:?` chu khong `:-`: khoa ky KHONG co mac dinh va
  # he khong tu sinh mot khoa moi moi lan khoi dong - lam vay la moi token da
  # phat chet im lang, va trong luc go loi no trong giong het "token sai chu
  # ky". Secret nen no o `.env` goc repo (da gitignore), khong o
  # `.env.server`/`.env.laptop`; hai file do chi mang tham so moi truong.
  JWT_SECRET: "${JWT_SECRET:?thieu JWT_SECRET trong .env}"
  # Id bang chinh sach ma tien trinh khoi dong voi (story 3.2, FR-28). KHONG
  # phai secret nen gia tri o `.env.server`/`.env.laptop`; `:-day-du` chu khong
  # `:?` vi mot tien trinh khong ai khai id phai chay bang van hanh, khong phai
  # chet. Danh muc id la danh muc dong suy tu glob `config/policy-*.yaml`, va
  # mot id go sai lam lifespan chet o giay dau kem ma POLICY_ID_KHONG_CO.
  HYPER_RAG_POLICY_ID: "${HYPER_RAG_POLICY_ID:-day-du}"
  # Co che do do (story 3.6, ADR-017). Chi nhan 0/1, mac dinh 0: tien trinh
  # khong ai khai co phai chay nhu 3.5, khong phai nhu mot cua so do. Bat thi
  # hang `refusal` ghi tang mutation (ghi hong la 500 AUDIT_GHI_HONG); trang
  # thai co ghi vao hang `startup` cua audit_log. Khong co endpoint bat/tat.
  HYPER_RAG_CHE_DO_DO: "${HYPER_RAG_CHE_DO_DO:-0}"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
  # Chon model cho wrapper LLM/embedding (story 2.2, adapters/llm_wrapper.py):
  # ten phai co trong config/danh-muc-model.yaml (loader tu choi model la
  # ngay luc dung). Gia tri o .env.server/.env.laptop (khong secret); key cua
  # provider thi danh muc chi ten bien (OPENAI_API_KEY/DEEPSEEK_API_KEY o tren).
  # OLLAMA_HOST chi co nghia khi bat profile local-llm; mac dinh tro service
  # ollama trong network compose, space `real` chi bind duong nay (AD-12).
  LLM_MODEL: "${LLM_MODEL:?thieu LLM_MODEL trong .env.server/.env.laptop}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:?thieu EMBEDDING_MODEL trong .env.server/.env.laptop}"
  OLLAMA_HOST: "${OLLAMA_HOST:-http://ollama:11434}"

services:
  neo4j:
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?thieu NEO4J_PASSWORD trong .env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:?thieu NEO4J_HEAP_INITIAL trong .env.server/.env.laptop}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:?thieu NEO4J_HEAP_MAX trong .env.server/.env.laptop}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:?thieu NEO4J_PAGECACHE trong .env.server/.env.laptop}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # image qdrant khong co curl/wget; kiem TCP bang bash /dev/tcp
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?thieu POSTGRES_USER trong .env.server/.env.laptop}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?thieu POSTGRES_PASSWORD trong .env}"
      POSTGRES_DB: "${POSTGRES_DB:?thieu POSTGRES_DB trong .env.server/.env.laptop}"
    volumes:
      # image postgres 18+ doi mount point ve /var/lib/postgresql (khong con .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # $$ de container tu expand bien cua chinh no, khong phu thuoc noi suy phia host
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Story 3.3 ra soat lai `depends_on` va healthcheck cua service nay khi tien
  # trinh bat dau giu hai ket noi kho (engine truy hoi dung trong lifespan):
  # khong phai sua gi. Dung `EngineACL` **khong mo socket nao** - ca
  # `AsyncQdrantClient` lan driver Neo4j deu mo pool luoi - nen `/health` van
  # xanh ngay khi tien trinh len, va `depends_on: condition: service_healthy`
  # cho ca ba kho van la thu dam bao loi goi dau tien co cho de noi toi.
  # Lifespan **khong** goi `khoi_tao()` (do la viec cua duong nap), nen no cung
  # khong them mot vong I/O nao vao thoi gian khoi dong.
  api:
    build: *api_build
    environment: *api_env
    # Quyet dinh pho cong (chot 31/08/2026): 8000 publish cong khai co chu dich cho demo;
    # tu Epic 3 moi endpoint du lieu bat buoc JWT. DB va ollama khong bao gio publish.
    # Luu y: cong do Docker publish di vong qua UFW (iptables chain DOCKER), khong dua vao UFW;
    # muon siet them sau khi co web thi doi sang "127.0.0.1:8000:8000" + reverse proxy mot moi.
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Man nap tai lieu (story 2.7): app FastAPI thu hai, cung image va cung volume
  # voi `api` de CLI trong container va man dung chung mot HYPER_RAG_WORKING_DIR
  # (cung so tai lieu, cung flock `ingest_{space}.lock`).
  #
  # Cong 8100 bind **chi loopback cua may chu**: man khong co xac thuc va se
  # khong co (ADR-022 quyet dinh 6, story 3.8: mot nguoi dung, sau SSH tunnel,
  # khong nam trong duong demo) nen no khong duoc lo ra ngoai bang bat ky duong
  # nao. Vao bang SSH tunnel tu laptop:  ssh -L 8100:127.0.0.1:8100 root@<may-chu>
  # (0.0.0.0 trong `command` la bind *ben trong* container - cong publish phia
  # host moi la cua ngo, va no la 127.0.0.1.)
  man-nap:
    build: *api_build
    environment: *api_env
    command: ["uv", "run", "--no-sync", "uvicorn", "api.man_nap:app", "--host", "0.0.0.0", "--port", "8100"]
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - api_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Console web (story 4.1): Next.js 16.3.3 build standalone trong image
  # (web/Dockerfile, node:20-alpine). Trinh duyet chi noi chuyen voi cong 3000;
  # moi loi goi `/api/*` di qua rewrite cua Next toi API_NOI_BO (ten service
  # `api` trong network compose), khong bao gio goi thang cong 8000 tu client.
  # Rewrite dong bang luc `next build`, nen API_NOI_BO la **build arg**
  # (`build.args` -> `ARG` trong web/Dockerfile), khong phai `environment`:
  # doi no la phai `up -d --build web`, mot bien luc chay khong doi duoc gi.
  # Cong 8000 van publish cho demo bang curl (quyet dinh 31/08); thu no ve
  # loopback + reverse proxy la Ask First cua spec 4.1, chua lam.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        API_NOI_BO: "http://api:8000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:20-alpine co wget cua busybox. 127.0.0.1 chu khong `localhost`:
      # alpine phan giai localhost ra ::1 truoc, ma server.js cua Next chi nghe
      # IPv4 (HOSTNAME=0.0.0.0) - healthcheck bang localhost do mai (do 07/09).
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Profile local-llm: chi khai bao, khong bat mac dinh, khong pull model o story 1.1.
  ollama:
    image: "ollama/ollama:${OLLAMA_TAG:-0.33.2}"
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
    name: hyper_rag_neo4j_data
  qdrant_data:
    name: hyper_rag_qdrant_data
  postgres_data:
    name: hyper_rag_postgres_data
  # Thu muc lam viec cua engine (HYPER_RAG_WORKING_DIR): kho KV JSON nam o day.
  api_data:
    name: hyper_rag_api_data
  ollama_data:
    name: hyper_rag_ollama_data
