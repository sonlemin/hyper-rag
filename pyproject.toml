[project]
name = "hyper-rag-copilot"
version = "0.1.0"
description = "AI Copilot hoi-dap tieng Viet tren kho tri thuc IT noi bo, phan quyen o muc hyperedge (fork HyperGraphRAG)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Nhom 1: goi ma vendor/hypergraphrag import ngay luc `import hypergraphrag`
    # (llm.py cua upstream import torch/transformers/aioboto3/ollama o top-level).
    # Khai chon loc, khong copy nguyen requirements.txt upstream (bo milvus, oracle, mongo, graspologic...).
    "aioboto3>=13",
    "aiohttp>=3.9",
    "nano-vectordb>=0.0.4",
    "networkx>=3.2",
    "numpy>=1.26",
    "ollama>=0.3",
    "openai>=1.40",
    "tenacity>=8.2",
    "tiktoken>=0.7",
    "tqdm>=4.66",
    "torch==2.3.0",       # upstream ghim 2.3.0; ban CPU qua index pytorch-cpu (xem [tool.uv.sources])
    "transformers>=4.40",
    # Nhom 2: stack du an (spine: bang Stack). Ep qdrant-client>=1.12 va pydantic>=2
    # de tranh pitfall spike 29/08 (pydantic v1 keo qdrant-client ve 1.0.1).
    "pydantic>=2",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    # Driver Neo4j ban async (story 1.4). Ghim <6 de khong nhay major khi
    # server dang la Neo4j 5.26.30 Community trong docker-compose.
    "neo4j>=5.26,<6",
    # Bang chinh sach la file YAML (AD-6). Khai tuong minh: truoc do pyyaml chi
    # la dep bac cau qua transformers, go transformers la loader chet theo.
    "pyyaml>=6",
    "uvicorn>=0.30",
    # Audit port Postgres (story 2.2, AD-16): async toan tuyen, spine Stack 0.31.
    "asyncpg>=0.31",
    # Man nap tai lieu (story 2.7) nhan file bang multipart. FastAPI khong keo
    # goi nay theo: thieu no thi `UploadFile` nem luc *chay* request dau tien
    # chu khong nem luc import, tuc mot man len xanh roi hong ngay lan nap dau.
    "python-multipart>=0.0.32",
    # Xac thuc JWT (story 3.1, spine Consistency Conventions "Xac thuc"): token
    # HS256, khoa ky doc tu bien moi truong. Ca hai goi duoi day deu chua co
    # trong uv.lock truoc story 3.1, ke ca duoi dang dep bac cau.
    "pyjwt>=2.10",
    # Hash mat khau bcrypt: seed chi chua hash, va nhanh "khong co tai khoan"
    # van chay mot phep bcrypt tren hash gia de thoi gian dap ung khong thanh
    # kenh do (I/O Matrix story 3.1).
    "bcrypt>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",        # TestClient cho api trong tests/
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Cai editable cac package cua Structural Seed; vendor/hypergraphrag import duoc
# duoi ten `hypergraphrag` ma khong sua file nao trong vendor/.
[tool.hatch.build.targets.wheel]
packages = ["core", "adapters", "api", "redteam", "vendor/hypergraphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not neo4j and not qdrant and not postgres'"
markers = [
    "neo4j: test can Neo4j that (container compose), mac dinh bo qua; chay bang `uv run pytest -m neo4j`",
    "qdrant: test can Qdrant that (container compose), mac dinh bo qua; chay bang `uv run pytest -m qdrant`",
    "postgres: test can Postgres that (container compose), mac dinh bo qua; chay bang `uv run pytest -m postgres`",
]
