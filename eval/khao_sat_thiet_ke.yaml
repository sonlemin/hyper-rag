# Bảng thiết kế 50 bản ghi khảo sát ba tỷ lệ n-ngôi (story 2.10).
#
# **Nguồn chuẩn của `scope` và `content_type`.** Mọi file trong `eval/khao_sat/`
# có đúng một mục ở đây, mọi mục có đúng một file, và nhãn của mục phải khớp
# frontmatter đọc bằng `core.ingest_scan`. Lệch một chiều nào cũng là
# `uv run pytest` đỏ (`tests/test_khao_sat.py`), cùng luật một-một mà story 2.5
# đặt cho bộ vàng và story 2.8 đặt cho corpus.
#
# **Mẫu số là bản ghi giả lập.** Quyết định 03/09/2026 của sonlm: doanh nghiệp
# không lưu báo cáo sự cố ở dạng dùng được, nên 50 bản ghi ở đây được dựng theo
# nghiệp vụ của 30 tài liệu Tech Support thật (giữ ngoài repo, trong
# `extra/khao-sat-50/tech-support/md/`). Hệ quả phải nói thẳng trong báo cáo:
# ba tỷ lệ mất vai trò mỏ neo độc lập cho corpus 2.8, vì người dựng corpus và
# người dựng mẫu số là cùng một bên. Chúng còn dùng được để kiểm tính nhất quán
# nội bộ giữa hai vật dựng khác thời điểm và khác mục đích.
#
# **Ba định nghĩa đếm chốt trước phép đếm đầu tiên**, ở
# `docs/adr/ADR-012-dinh-nghia-dem-ba-ty-le-n-ngoi.md`. Không sửa nội dung bản
# ghi nào sau khi đã thấy con số của bất kỳ tỷ lệ nào.
#
# **Space riêng.** 50 bản ghi nạp vào space `khao_sat`, không bao giờ vào
# `synth`. Tên file cũng không trùng với `eval/corpus/` hay `eval/data/`, nên
# một lần gõ nhầm `--space synth` không âm thầm ghi đè mẫu số của Đo 2 và Đo 3.
#
# **Hạn ngạch 25/15/10** theo ba bộ phận, chốt trong README của thư mục nguồn,
# suy từ tỷ lệ 50/50 nội bộ và khách hàng của corpus 2.8 (20/20 trên 40 tài
# liệu). Ở đây tỷ lệ đó giữ đúng: 25 bản ghi Tech Support mang scope khách hàng,
# 25 bản ghi DevOps và Data Center mang scope `noi_bo`.
#
# **Luật gán scope**, viết ra để nó là một quy tắc chứ không phải 50 quyết định
# lẻ. Bộ phận giữ hồ sơ khách hàng thì bản ghi mang scope khách hàng; bộ phận
# giữ tri thức vận hành nội bộ thì bản ghi mang `noi_bo`. Trong 25 phiếu Tech
# Support, tên miền khách `khachhang01` tới `khachhang11` gộp về
# `khach_hang_a`, `khachhang12` tới `khachhang22` gộp về `khach_hang_b`: hai
# scope khách hàng của hệ đại diện cho hai khoang thuê bao, còn 22 khách giả lập
# là 22 hồ sơ nằm trong hai khoang đó.
#
# Loại nội dung dùng bảng 13 hạng của `config/hang-do-nhay.yaml`. Ngưỡng nhạy
# cảm của khảo sát là hạng 20 (`bao_cao_su_co`) trở lên, xem ADR-012.
#
# ============================================================================
# BA ĐIỀU ĐÃ KHAI VỀ MẪU SỐ NÀY - đọc trước khi thêm hay sửa một bản ghi
# ============================================================================
#
# Một là **quyết định**, hai là **khiếm khuyết đã biết**. Cả ba đều bị test khóa
# lại, nên sửa mà quên khai lại là `uv run pytest` đỏ.
#
# --- (1) QUYẾT ĐỊNH: phủ 9 trong 13 loại nội dung ---------------------------
#
# Vắng `cmdb`, `faq`, `log`, `tai_lieu_san_pham`. Lý do là hình dạng nghiệp vụ
# của ba bộ phận được lấy mẫu: Tech Support giữ phiếu ticket, DevOps và Data
# Center giữ runbook, SOP và báo cáo sự cố; không bộ phận nào trong ba bộ phận
# đó là chủ sở hữu của sổ tài sản (`cmdb`), của log hệ thống (`log`), của tài
# liệu sản phẩm hay của trang hỏi đáp. Corpus 2.8 có đủ 13 vì nó được dựng để
# phủ bảng loại, còn tập này được dựng để giống nghiệp vụ thật.
#
# Hệ quả phải nói ra khi báo cáo: hai trong bốn loại vắng là loại **nhạy cảm**
# (`log` hạng 24, `cmdb` hạng 26), nên trục loại nội dung của `khao_sat` hẹp hơn
# của `synth` đúng ở vùng mà tỷ lệ 2 và tỷ lệ 3 lấy làm mẫu số. Bảng hai cột của
# `eval.xem_ty_le` vì vậy **không** so trên cùng một trục, và chênh lệch của mỗi
# tỷ lệ trộn hai nguyên nhân: hình dạng tri thức khác nhau, và tập loại nội dung
# khác nhau. Trang in cảnh báo đó và ADR-012 ghi nó.
#
# --- (2) KHIẾM KHUYẾT: bốn tên file mâu thuẫn `content_type` -----------------
#
#   dv-10-runbook-xu-ly-canh-bao-ram-cpu.md          khai canh_bao
#   dv-13-sop-xoay-vong-khoa-truy-cap-object-storage.md  khai bi_mat_ha_tang
#   dv-14-sop-cap-quyen-truy-cap-ha-tang.md          khai bi_mat_ha_tang
#   dc-03-runbook-kiem-tra-nhiet-do-phong-may.md     khai canh_bao
#
# Nhãn loại dẫn đầu tên file nói một đằng, `content_type` khai một nẻo. Nhãn khai
# mới là nhãn thật - `core.ingest_scan` đọc frontmatter, không đọc tên file - nên
# **không con số nào sai**. Cái sai là người soát: `doc_key` là tên file và nó
# hiện ở cột đầu của ảnh chụp, của bảng phân bố và của trang CT-03, nên người
# đọc suy ra hạng độ nhạy từ một chữ không mang nghĩa gì với hệ.
#
# --- (3) KHIẾM KHUYẾT: mốc thời gian nằm ở tương lai ------------------------
#
# Bản ghi sinh ngày 03/09/2026 (dấu ở đầu mỗi file), nhưng sự việc bên trong
# chạy từ 12/09/2026 tới 20/10/2026 - phiếu ticket 26/09 tới 20/10, postmortem
# trong tháng 9. Corpus 2.8 thì neo quanh 12/08/2026 và dừng ở 18/09/2026. `time`
# là một trong 8 vai được trích, nên mẫu số mang một trục thời gian không thể
# đúng và gần như không giao với `synth` (đúng một mốc chung, 12/08/2026, xuất
# hiện tình cờ ở dv-07).
#
# --- VÌ SAO KHÔNG SỬA NGAY -------------------------------------------------
#
# Sửa tên file đổi `doc_key`; sửa mốc thời gian đổi sha256 thân. Cả hai buộc nạp
# lại, và cả hai đụng đúng luật Never của spec 2.10: "không sửa nội dung 50 bản
# ghi sau khi đã thấy con số của bất kỳ tỷ lệ nào". Luật đó có mặt để không ai
# phải phân biệt một lần sửa lành với một lần chỉnh cho ra số đẹp bằng cách tin
# lời người sửa - và nó đáng giá nhất đúng lúc lần sửa *thật sự* lành, như lần
# này. Hai lỗi không đổi con số nào: ba tỷ lệ đếm số vai được điền và hạng độ
# nhạy, không đếm ngày tháng, và `content_type` lấy từ frontmatter.
#
# **Cấm sửa hai khiếm khuyết trên cho tới khi story 2.12 nạp lại.** 2.12 vốn
# phải nạp lại toàn bộ để chuẩn hóa thực thể, nên sửa kèm lúc đó là miễn phí, và
# ba tỷ lệ được đếm lại trong cùng commit theo đúng điều kiện đổi của ADR-012.
# Hai khoản trong `_bmad-output/implementation-artifacts/deferred-work.md` giữ
# địa chỉ; `tests/test_khao_sat.py` ghim đúng bốn tên file và khoảng mốc thời
# gian hiện có, nên một lần sửa lén là test đỏ.
#
version: 1

# Hạn ngạch theo bộ phận. Test khóa đúng ba số này: một bộ phận co lại còn 5 bản
# ghi trong khi bộ phận khác phình ra vẫn giữ tổng 50, và khi đó "phủ ba bộ
# phận" thành một câu đúng về hình thức mà sai về chất liệu.
han_ngach:
  tech_support: 25
  devops: 15
  data_center: 10

bo_phan:
  - id: tech_support
    ten: Tech Support
    mo_ta: >-
      Phiếu hỗ trợ sự cố hosting của khách hàng: mã ticket, khách hàng, mức ưu
      tiên, người tiếp nhận, mốc mở và đóng, nguyên nhân, cách xử lý và ghi chú
      nội bộ. Đây là bộ phận có 30 tài liệu thật làm nền nghiệp vụ, nên 25 bản
      ghi này bám sát hình dạng nghiệp vụ nhất trong ba nhóm.
  - id: devops
    ten: DevOps / Vận hành
    mo_ta: >-
      Báo cáo sau sự cố, runbook và SOP hạ tầng. Nhóm duy nhất mang loại
      `postmortem` và `bi_mat_ha_tang`, tức mang cả hai đầu của thang độ nhạy.
  - id: data_center
    ten: Data Center (Helpdesk, Server IDC)
    mo_ta: >-
      Runbook, SOP và hướng dẫn xử lý sự cố nội bộ ở mức thiết bị và phòng máy.
      Nhóm này kéo phần dưới của thang độ nhạy, để tập `KHÔNG_NHẠY` của định
      nghĩa composition risk không rỗng.

