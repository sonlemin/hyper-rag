    scope_chinh: noi_bo
  - id: ssl_het_han
    ten: Chứng thư số hết hạn - thời gian và sở hữu
    mo_ta: >-
      Chứng thư số của cổng thanh toán khách hàng B hết hạn ngày 26/08 vì lịch
      gia hạn thuộc về một nhóm đã bàn giao. Hai trục của kịch bản là *thời
      điểm* (hết hạn, nhắc trước 30 ngày, gia hạn 90 ngày) và *sở hữu* (ai chịu
      trách nhiệm sau bàn giao) - chất liệu cho N6 và cho vai slot `owner`.
    scope_chinh: khach_hang_b
  - id: nhieu
