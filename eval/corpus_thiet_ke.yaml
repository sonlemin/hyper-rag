    mo_ta: >-
      Tài liệu không thuộc kịch bản nào. Chúng có mặt để phép truy hồi phải
      *chọn*: cùng chủ đề, cùng loại nội dung, cùng từ vựng vận hành với tài
      liệu lõi, nhưng không mang đáp án. Không có phần này thì recall của Đo 3
      đo một bài toán quá dễ.
    scope_chinh: null

