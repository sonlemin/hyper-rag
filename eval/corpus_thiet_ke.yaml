# Bảng thiết kế corpus dựng ~40 tài liệu (story 2.8, PRD addendum A8).
#
# **Viết trước tài liệu và là nguồn chuẩn.** Mọi file trong `eval/corpus/` có
# đúng một mục ở đây, mọi mục có đúng một file, và `scope`/`content_type` của
# mục phải khớp frontmatter đọc bằng `core.ingest_scan`. Lệch một chiều nào cũng
# là `uv run pytest` đỏ (`tests/test_corpus.py`), cùng luật một-một mà story 2.5
# đặt cho bộ vàng trích xuất.
#
# Vì sao bảng có trước: cửa quét của `core/ingest_scan.py` **không** whitelist
# `content_type`, nên một chữ gõ sai trong frontmatter đi lọt tới ingest rồi mới
# nổ `SensitivityRankUnknown` và từ chối cả lô 40 tài liệu *sau khi* đã trả tiền
# cho phần đầu. Bảng này cộng test của nó bắt đúng lỗi đó ở CI, rẻ hơn nhiều so
# với nới luật trong `core/`.
#
# Ba scope, đơn trị mỗi tài liệu (AD-4), và scope mang chiều khách hàng. Biên
# cách ly của RT-01 nằm ở đây: `devops` chạm `noi_bo` và `khach_hang_a` nhưng
# **không** chạm `khach_hang_b` (`config/policy-toi-gian.yaml`), nên mọi tài
# liệu `khach_hang_b` là một ca thử thật của biên đó ở T3.
#
# Loại nội dung dùng 12 loại của A8 cộng `bi_mat_ha_tang`; hạng của từng loại ở
# `config/hang-do-nhay.yaml`. Bảng chính sách đầy đủ là việc của story 3.2: cho
# tới lúc đó, loại chưa khai trong `config/policy-toi-gian.yaml` là fail-closed
# L0, đó là trạng thái đúng chứ không phải một lỗ.
version: 1

# Số đỉnh của hyperedge demo App01 (PRD mục lục giả định 6.3 khoản 4). Chốt
# **một** giá trị, đếm trên đồ thị đã nạp thật chứ không chọn theo tài liệu
# nguồn - tài liệu nguồn lệch nhau 5 và 6, và đó chính là giả định treo.
#
# Đo ngày 03/09/2026 trên space `synth`, đợt `2cee40883c0d45399954001b4aef7cc1`
# (lần nạp lại đủ 40 tài liệu sau khi `k1-03`..`k1-06` sửa cho khớp bộ vàng).
# Hyperedge demo là fact chính của `k1-03-bao-cao-su-co-inc-1208.md`, id
# `he-1052ab379974d65544056533`, nối **8** đỉnh entity - điền đủ cả 8 vai slot:
# `subject` = "trang thanh toán App01" · `symptom` = "ngừng phục vụ 40 phút, trả
# lỗi 502 với tỷ lệ 100%" · `cause` = "chỉnh sai giới hạn bộ nhớ PHP-FPM" ·
# `condition` = "lưu lượng vượt 5000 req/phút" · `time` = "12/08/2026 lúc 09:20" ·
# `owner` = "Trần Thị Hạnh" · `remediation` = "trả giới hạn bộ nhớ PHP-FPM về mức
# cũ rồi nạp lại cấu hình theo SOP-12" · `source` = "INC-1208".
#
# **Đây là số của một cấu hình trích xuất, không phải hằng số của lược đồ.** Nó
# phụ thuộc cách LLM gom fact: hyperedge thứ hai của cùng tài liệu chỉ 4 đỉnh, và
# bản `k1-03` trước khi sửa (kể sự cố rời rạc hơn) cho hai hyperedge 5 đỉnh. Đổi
# prompt theo kỹ thuật A13 mà 2.6 còn treo là con số có thể đổi. Ghi ra đây để
# chương 4 không trình bày 8 như một tính chất của mô hình.
so_dinh_hyperedge_demo: 8

