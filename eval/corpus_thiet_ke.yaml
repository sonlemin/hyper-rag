    ghi_chu: >-
      **Tài liệu bí danh, thêm ở story 2.12 (FR-32).** Gọi máy chủ bằng tên miền
      đầy đủ `app01.company.vn`, trong khi `k1-01`, `k1-03` và `k1-05` gọi nó là
