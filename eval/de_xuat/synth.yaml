# `config/tu-dien-thuc-the/synth.yaml` - bảng đó gom từ ảnh chụp trước đợt
# nạp, giữ ở `synth-truoc-nap-lai-05-09.yaml`. File này là bằng chứng của
# một chuyện khác: vòng "gom -> xác nhận -> nạp lại" **chưa hội tụ**. Bốn
# nhóm cũ đã gộp đúng và biến mất khỏi đây, nhưng đồ thị mới lại sinh ba
# nhóm hoa/thường khác chưa ai gom, cộng hai nhóm liên scope. Mỗi lượt nạp
# lại sinh vật liệu mới cho lượt sau; xem khoản ledger cùng tên.
# ĐỀ XUẤT bí danh thực thể - **không phải** từ điển đang chạy (story 2.12).
# Sinh bằng `python -m eval.de_xuat_bi_danh`. Lược đồ ở đây khác lược đồ
# của `config/tu-dien-thuc-the/`: khóa gốc là `de_xuat`, và mục không có
# `xac_nhan`. Người xác nhận chép sang từng mục một, thêm dấu
# `xac_nhan: "<tên> <ngày>"`, và bỏ `ly_do`/`so_lan`/`llm`.
