ức câu "xem như không bao giờ kéo dài phiên" chỉ là quy ước ở nơi gọi trong khi hàm là public; nay `ValueError` ngay trong hàm, cùng tinh thần `maxLength` của ô hỏi. Thêm: `POST /auth/xem-nhu` khai thân **pydantic `extra="forbid"`** (bản đầu tự parse nên nhận im lặng khóa thừa, không có schema, và docstring tự nhận đi qua handler `RequestValidationError` mà nó không đi qua); ba hàng `query`/`refusal`/`permission_mismatch` của một lượt mượn vai nay mang khóa `chi_tiet.vai_that` **cùng khuôn `grant_ids` của 5.3** (không có nó thì một lượt của `dev01` mượn `truong_nhom` không khác một tài khoản `truong_nhom` thật, và hậu kiểm FR-23 phải ghép theo cửa sổ thời gian) - `vai_that` truyền qua tham số của ba hàm ghi audit chứ **không** thêm trường vào `PermissionContext`, vì không tầng nào dưới `api/` đọc nó; và comment `policy-day-du.yaml` gọi `truong_nhom` là "vai owner duyệt break-glass" bị **bác**: cửa owner của 5.2 là `users.group_name`, không phải vai. **Bốn lỗ ở `web/`, hai trong bốn là ca hỏng thật đo được.** Bộ đếm lần đổi vai thay bằng **dãy tên vai** ghi ngay lúc lời gọi thành công: một bộ đếm cộng tên vai đọc từ `phien.vai` lúc chèn cho mốc mang tên vai **vừa rời đi** khi lần đọc phiên chưa xong, và hai lần đổi chồng nhau (lần đọc thứ nhất bị effect hủy) cho **một** mốc trên **hai** lần đổi thật - cả hai nay có ca e2e. Menu nay **cư xử như menu**: phần tử `role="menu"` chứa chỉ `menuitem*` (tiêu đề qua `aria-labelledby`, khối trạng thái và hộp lỗi ra ngoài), Up/Down/Home/End di chuyển focus, focus vào mục đang chọn khi mở, và vẫn **không** `aria-modal` để ⌘K còn chạy. Hộp lỗi và menu gộp thành **một** tấm nổi: hai tấm cùng `top`/`right`/`z-index` mà một lần đổi hỏng thì menu vẫn mở, nên hộp phủ lên menu (ca cũ chỉ đòi "hộp có chữ" nên nó xanh với cả trạng thái chồng hình; ca mới so hai `boundingBox`). Danh mục vai **đọc lại mỗi lần mở** (bảng chính sách hoán được lúc chạy, nên một danh sách cache là một dropdown liệt kê vai đã biến mất); danh mục rỗng nói ra bằng một dòng; khung mang `data-dang-doc-lai` để một `/auth/toi` treo không giữ vai cũ trên topbar vô thời hạn; `la_phien` áp **đều** luật chuỗi không rỗng cho `tai_khoan`/`vai` như `la_act` đã áp; `mo_ta_vai` về `nhan.ts` (hàm thuần, cùng họ `NHAN_VAI`); dòng thoát đọc `tai_khoan_that`; và `maxLength` thêm một **bộ đếm ký tự** khi gần trần vì cắt cụt lặng lẽ vẫn là một chế độ hỏng. Ba họ giá trị CSS viết thẳng (`rgba` trắng mờ trên nền tối, bóng dropdown, `#ffffff` trên nền đặc) khai thành **ngoại lệ có lý do** ở đầu `globals.css`. **Phép canh siết ở sáu chỗ.** Nặng nhất: **không ca nào cầm một token đã đổi vai đi quá `/auth/*`** - sửa `doc_grant_ids` rơi về `claim.act.role` (thứ ai đó rất dễ làm với lý do "người demo mất break-glass khi đổi vai") vẫn xanh cả bộ; nay có ca chèn grant cho `(dev01, devops)`, mượn `tech_support`, và khẳng định trên **ngữ cảnh quyền đọc bên trong lời gọi engine** rằng `role` là vai mượn, `real_account` là tài khoản thật, `grant_ids` rỗng, rồi sống lại sau khi thoát - đột biến đã chạy và test đỏ. Ba luật của `test_chinh_sach.py` còn lặp `HAI_VAI` nay chạy trên `NAM_VAI`, cộng một ca mới khẳng định `allowed_keys` của `sale_ba`/`admin` **rỗng cả ba namespace**. `test_danh_muc_vai_...` hoán bảng bằng `POST /admin/policy` trước rồi mới so (bản cũ dựng kỳ vọng bằng bảng mặc định, nên một handler đọc sai nguồn vẫn xanh). Hợp đồng `TRUONG_DANH_MUC_VAI` nay được ghim, và ba phép ghim đổi từ **so định dạng nguồn** sang **gọi handler** (`assert f'"{khoa_act}": (' in py` ghim đúng cách xuống dòng của một biểu thức). Đường quá hạn của `asyncio.wait_for` và đường ký hỏng đều có ca. `xem-nhu.spec.ts` 16 -> **27 ca**: ba nhánh hỏng của menu, dán quá trần (khẳng định ô cắt về đúng trần **và** không request nào bay đi), hai lần đổi chồng nhau, hộp lỗi không phủ menu, menu semantics. `kiem-tay-xem-nhu.mjs` sửa một **cuộc đua trong chính phép kiểm** (`page.on("response")` với `await r.json()` bên trong, so ngay sau `waitForSelector` nên FAIL ngẫu nhiên với `api null` ở đúng thứ duy nhất đo được lời hứa AD-4 trên bảng thật), bọc `try/finally` đóng Chromium, và từ chối `--goc`/`--cau` thiếu giá trị. Sổ nợ: **hai khoản 3-8 được mở rộng** (trần nhịp nay phủ **chín** tuyến ghi - bảy break-glass cộng hai xem như; trần thân phủ thêm field `vai` không có `max_length`), và **hai khoản `defer` mới**: `D1` địa chỉ **5-4** (đang mượn vai thì yêu cầu và grant bind vào cặp `(sub, vai giả)`, nên chính người thật nhận 409 `YEU_CAU_DANG_CHO` và một grant "sống lại" mỗi lần mượn lại vai ấy - ba đường sửa, cần một quyết định sản phẩm), `D2` địa chỉ **4-7** (vòng focus trên topbar là `primary` trên `primary-deep`, **1,55:1**, dưới cả sàn 3:1 cho chỉ báo phi văn bản; có từ 4.2, story này thêm hai nút nữa vào đúng vùng đó). Design Notes thêm ba mục mà review đòi: **vai mượn không bị chặn trên bởi vai thật** (`demo01` vai thật `tech_support` mượn được `truong_nhom` L2 - đúng FR-18 vì cửa là hai cờ chứ không phải vai, và vì sao đó không phải một đường đi vòng qua break-glass), **`sale_ba` và `admin` giống hệt nhau từng ô** nên hai dòng menu cho hai kết quả không phân biệt được, và mượn `admin` **không** đưa quyền quản trị (hai cờ đến từ claim, `POST /admin/policy` vẫn hỏi `claim.admin`). `## Suggested Review Order` điền theo khuôn 4.4.
  4-6-drawer-đồ-thị-kiểu-paper-với-hover-trích-dẫn: done  # 08/09/2026, sau vòng review đối kháng ba lớp (0 intent_gap / 0 bad_spec, **22 khoản `patch` áp hết**, cộng 1 khoản `defer` đã ghi sổ). **2677 test xanh dev** (2655 baseline + 16 ca nhóm (13) của `tests/test_web_khung.py` cộng 6 cặp tương phản mới; file ấy là 97 -> **119** ca thu thập), 50 deselected, 0 skip. **Không chạm `core/`, `adapters/`, `api/`, `vendor/`**: story thuần `web/` cộng test cộng năm màu token - không có diff `core/` để trình. `POST /do-thi` của story 3.7 lần đầu có bề mặt gọi nó. **Sáu module mới ở `web/`**: `api/do_thi.ts` (hợp đồng, kiểu, `la_do_thi`, `lay_do_thi`), `app/do_thi_khung.ts` (hàm thuần đổi mã hiển thị), `app/do_thi_bo_cuc.ts` (hàm thuần tính vị trí), `app/VungDoThi.tsx` (Cytoscape), `app/DrawerDoThi.tsx` (vỏ drawer), `app/hover_do_thi.ts` (context nối cite-row với vòng); cộng `app/ThanCoSlab.tsx` tách khỏi `ManChat.tsx` vì legend drawer hiện `label` = `cau_fact` **đã che** nên nó cần đúng luật slab của 4.4, và hai bản chép là hai bản lệch nhau ở lần sửa đầu. **Bốn luật là cơ chế.** (1) **Id thật dừng ở biên**: đúng ba module được đọc `.id` của dữ liệu server (`api/hoi_dap.ts`, `api/do_thi.ts`, `app/do_thi_khung.ts`), và `test_chi_ba_module_cham_id_hyperedge_that` quét cả `web/src` - vế mạnh hơn phép quét "id đi ra DOM" của 4.4, vì 4.6 nhận cả một đồ thị đầy id thật. `dung_khung` cho `HE-nn` / `en-k` / `HE-nn#slot`, node che **không gộp** giữa hai vòng (ADR-018 quyết định 2), id không có citation bị bỏ và số bị bỏ ra ở `bi_bo`. (2) **Bố cục tất định**, canh bằng hai phép quét: không `Math.random`/`Date.now`/`crypto.getRandomValues`/`new Date(` trong `web/src`, và `VungDoThi.tsx` chỉ khai `layout: {name: "preset"}` (sáu tên layout khác bị cấm đích danh); ca e2e đóng drawer rồi mở lại và so **ảnh canvas** bằng `Buffer.compare` - bằng nhau từng byte. (3) **Một empty-state cho mọi lý do trống**: chưa có lượt, lượt từ chối, và "gửi 2 id đi mà thân trả về không vòng nào" ra DOM **giống hệt nhau** (ca e2e so `innerHTML` của `.drawer_do_thi__than`); lượt không citation nào thì **không request nào** bay đi. Lỗi thì ngược lại: hộp đỏ mang `data-ma-loi` (`DO_THI_LA` cho thân sai hình, mã của `api/` cho 4xx/5xx), 401 đi qua `la_het_phien`. (4) **Hover chỉ nối dây cho lượt drawer đang vẽ**, và lượt ấy là lượt mới nhất **có envelope** (trả lời **hoặc** từ chối) chứ không `id_tra_loi_moi_nhat` của 4.4 - dùng lại nó thì nhịp 3 của demo để nguyên đồ thị của Tech Support trên màn trong khi `sale_ba` đã bị chặn. **Ba chỗ lệch với mockup, cả ba nói ra**: dải năm màu vòng `graph-ring-1..5` là token mới (mockup chỉ khai hai màu; 6,80 · 5,91 · 7,68 · 7,87 · 9,07 trên nền trắng, không màu nào trùng `graph-hover`, `graph-ring-1` cố ý bằng `primary`); hover đổi **viền 4px -> 7px cộng quầng** chứ không đổi màu chữ vì `graph-hover` trên nền trắng chỉ 2,30:1, và thêm một tín hiệu **chữ** "→ đang sáng HE-nn" trên cite-row; nhãn vai slot và chú thích legend dùng `ink-muted` chứ không `ink-faint` (3,06:1). **Hai thứ thêm mà spec không đòi, cả hai vì canvas mù với máy và với trình đọc màn hình**: gương chữ `sr-only` (`data-guong-vong`/`data-guong-dinh`, đỉnh che mang `•••` và `title` "Cần quyền L2") và ba số đếm `data-so-vong`/`data-so-dinh`/`data-so-dinh-che` đối chiếu được với thân trả về. **Một lỗ thật do vòng e2e bắt được**: bản đầu đặt drawer `position: absolute` phủ lên vùng hội thoại, và nó **che mất composer** - mở đồ thị ra là không hỏi được câu tiếp, đúng nhịp mà buổi demo cần nhất; nay drawer là **anh em flex** của cột chat (`.man_chat__cot`), kéo grip trong khoảng 28-72%. **Playwright: 29 ca mới** (`web/e2e/do-thi.spec.ts`), lưới `web/` là **122 ca / sáu spec**, ảnh `eval/anh_bang_chung/do-thi-4-6-1280.png`. **Kiểm tay trên máy chủ thật 08/09 bằng `node web/e2e/kiem-tay-do-thi.mjs --tai-khoan dev01`** (chromium thật trỏ `103.69.194.185:3000`, không mock tuyến nào, tốn tiền LLM thật): **16 PASS · 0 FAIL**, ảnh `eval/anh_bang_chung/kiem-tay-4-6-do-thi.png`. Số đo: `dev01` hỏi câu ghim ra 2 citation L2, drawer vẽ **2 vòng · 6 đỉnh · 0 đỉnh che** và `/do-thi` nhận **đúng** hai id mà `/hoi-dap` vừa trả; hover từng hàng làm sáng đúng `HE-01`/`HE-02` kèm chú thích chữ; đổi sang Tech Support gửi lại **cùng danh sách id** và server trả **1 vòng · 1 đỉnh che** - tức server thật sự lọc lại, không client; đổi sang Sale/BA rồi hỏi lại ra template từ chối và drawer về đúng empty-state, không vòng nào của vai trước còn trên màn. **Không lời gọi LLM nào sinh từ `/do-thi`**: `audit_log` trong cửa sổ ấy có `llm_cost` đúng **5** hàng = 2+2+1 của ba lượt hỏi (lượt từ chối chỉ tốn 1), 3 `query`, 1 `refusal`, 2 `role_swap`, và **không hằng `event` nào mới**, trong khi log `api` ghi 4 lượt `POST /do-thi` 200 - đúng ADR-018 quyết định 3. Một khoản ledger mới địa chỉ **4-7**: tooltip "Cần quyền L2" vẽ **trên canvas** không có phép kiểm tự động nào (Cytoscape không phơi node ra DOM), cả e2e lẫn kiểm tay đều chấm bản gương DOM. Không khoản treo nào mang địa chỉ 4-6 (khoản `label` của node hyperedge đã đóng ngay trong 3.7 khi sonlm mở Ask First). **Vòng review đối kháng tìm ra bốn lỗ thật mà bộ test cũ không thấy**, cả bốn nay có ca canh: `void import("cytoscape").then(...)` **không `.catch`** (chunk hỏng thành unhandled rejection cộng một drawer đứng im, nay là hộp đỏ mã riêng `DO_THI_VE_HONG`); kéo grip **không gọi `cy.resize()`** nên canvas giữ kích thước cũ và đồ thị bị cắt, trong khi hai ca grip đo `boundingBox` của drawer vẫn xanh (nay `ResizeObserver` cộng `fit`, và một ca so ảnh canvas trước/sau cú kéo); **đổi vai lúc drawer đóng** rồi mở lại vẽ đồ thị của vai trước đúng một nhịp (nay một effect xóa khóa `[id_luot, vai]` đứng trước effect nạp và cố ý không đọc `mo`); và `font-size` của Cytoscape là **đơn vị không gian đồ thị** nên `fit` co chữ xuống dưới sàn 13px trên đồ thị nhiều vòng, phá thẳng một câu `Always` (nay nhân ngược theo `1/zoom`, cỡ chữ trên màn ra DOM ở `data-co-chu-man-hinh`, ca e2e 40 vòng đo nó). **Ba phép canh chấm sai