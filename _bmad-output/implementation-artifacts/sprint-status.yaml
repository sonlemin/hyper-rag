, khối đối chứng tính lại trên 41, và trang cùng console nói ra chỗ chúng khác nhau. Trên 41 tài liệu chung: `that_khu` cho Overall 405/630 = **64,3%**, Sensitive 154/218 = **70,6%**; `real` cho 100,0% / 100,0%, tức Qwen thổi hai tỷ lệ đầu lên **+35,7** và **+29,4 điểm**; vai `owner` điền 96,5% so với 5,9%, hyperedge 2 vai 0% so với 35,7%. Phép hạn chế là hàm thuần `eval.ty_le_n_ngoi.han_che_theo_tai_lieu` (giữ hyperedge khi **mọi** `doc_key` của nó nằm trong tập giữ) và tính được **ngay trong repo** nhờ luật cùng muối - 41 `doc_key` đã băm của `real` là tập con thật sự của 50 của `that_khu` và 41 `sha256` băm khớp từng cặp, nay có test thay cho dòng `sha256sum` gõ tay. Đây là phép so mà 2.11 chỉ mô tả được bằng ba dấu vân tay trên hai tập *khác nhau*. **Precision đường cục bộ nay đã đo** (vòng `v2-qwen-cuc-bo`, đúng mẫu số R2): ghép cặp **48,2%, DƯỚI cổng 60%**, so với 70,7% của DeepSeek; trang tỷ lệ in con số đó thay câu "chưa đo lần nào". **Kết luận mỏ neo: có neo, nhưng bị chặn trên bởi lỗ của story 2.12.** Composition-Risk 0/225 nay đo trên tài liệu thật bằng đúng bộ trích xuất của `synth` nên nó đọc được; nhưng chỉ **6/225** ca nhạy cảm có nổi một entity còn lộ ở vùng không nhạy cảm (synth 26/81, khao_sat 40/151), tức số 0 đó nói **chuẩn hóa thực thể chưa làm**, không nói tri thức doanh nghiệp kín. **Sửa lại con số của 2.11 ngay trong story này**: 9 ca mất là 18%, cả 9 do bộ trích xuất. **Vòng review đối kháng 3 lớp (05/09): 14 khoản áp hết, 0 bác, 0 loopback**; 1 khoản phân loại `intent_gap` (sonlm chốt phương án tách vai hai mẫu số, spec sửa ở phần frozen và ghi Spec Change Log vòng 1). Nặng nhất là khối đối chứng đang so 41 với 50 dưới một câu tự khẳng định hai vế bằng nhau - con số +32,2/+28,4 đã lọt vào bốn artifact trước khi bị bắt. Bốn khoản còn lại đáng ghi: SDK `openai` tự thử lại 2 lần **dưới** lớp `thu_lai.py` (một lời gọi thành 12 request và `ChanNhipQuaLau` bị đi vòng) - nay `max_retries=0`; lùi lũy thừa không jitter trong khi các chunk chạy song song dưới `TaskGroup` nên chúng thử lại đồng pha và tự tái tạo 429; bốn tham số điều khiển của `goi_co_thu_lai` mang tên trần nên một kwarg trùng tên của provider bị nuốt lặng lẽ - nay có tiền tố gạch dưới; và `--uoc-tinh` không có test nào chấm nó **thật sự** đọc được tỷ lệ từ `eval/so_do_nap/` (mọi assert cũ là chuỗi con mà nhánh fallback cũng in ra, nên đổi một khóa của `so_do_nap` là mọi lần chạy lặng lẽ mất phần tổng tiền mà cả suốt vẫn xanh). `SPACE_THAT_KHU` chuyển xuống `core/ids.py` cạnh `SPACE_REAL`: **diff chạm `core/` một hằng cộng bình luận, cần sonlm duyệt.** Ledger: 2 khoản thu hẹp kèm bằng chứng ngược (precision đường Qwen nay có số 48,2% nhưng trên corpus dựng chứ không trên tài liệu công ty; "1.403 token/chunk" **không** phải hằng của model - cùng model trên bộ vàng cho 307, nên sinh lặp phụ thuộc tài liệu), 1 khoản đóng khung rõ phần cách đọc cũ đã bị bác, **10 khoản mới đều có địa chỉ** (story kế chạm `thu_lai.py` × 2, story kế chạm `--uoc-tinh` × 2, story chạy vòng đo kế × 2, story 3.3 × 1, story sinh lại `--xuat-json` × 1, sonlm quyết × 2), không khoản nào mồ côi. Không một byte nội dung tài liệu vào git: quét 27.404 cụm 5 từ và 1.393 token >=8 ký tự của 50 tài liệu trên toàn diff, **0 cụm trùng**, 24 token trùng đều là từ vựng chung.
