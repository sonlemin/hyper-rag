  3-5-từ-chối-hai-tầng-không-phân-biệt-được: done  # **2088 test xanh dev** (2037 baseline, 51 ca ở `tests/test_tu_choi.py`), 27 marker kho thật deselect, 0 skip / 0 xfail. `core/` chạm **đúng một file, đúng một hằng**: `core/audit.py` thêm `EVENT_REFUSAL` cộng sửa comment `:47-50` cho khớp (ngân sách dòng lệnh 1034 -> 1036 / 1200) - sonlm duyệt diff `core/` và `adapters/` 06/09, commit `f8d9aec`, CI máy chủ PASS kể cả 2 ca `postgres` mới. **Điều tra của story bác một lời khai trong sổ nợ 3.3**: `kg_query` trả `PROMPTS["fail_response"]` ở năm chỗ nhưng chỉ **ba** chỗ sống (`operate.py:573,576,581`, cả ba là ca "LLM không trích được từ khóa"); `:568` nằm trong `except json.JSONDecodeError` mà khối `try` quanh nó không có lời gọi `json` nào, và `:599` (`context is None`) là code chết vì `_build_query_context` **không có một `return None` nào** - đường ra duy nhất của nó là f-string ba nhãn ba khối `:719-731`. Hệ quả: **ngữ cảnh rỗng chưa bao giờ đi qua `fail_response`**, nó hiện ra thành một cái khung còn nguyên với ba khối ```csv``` trắng, nên `adapters.tra_loi.ngu_canh_rong` là một hàm thuần đọc chuỗi chứ không một phép so với `None`. Cả ba phát biểu có test đọc thẳng nguồn vendor canh giữ. **Bước sinh câu trả lời lấy về cho dự án**, và đó là cách duy nhất có được "cờ có cấu trúc" mà FR-16 đòi: prompt `rag_response` của vendor báo no-answer bằng văn xuôi tiếng Anh (`prompt.py:199`) và còn cho phép "incorporating any relevant general knowledge" (`:196`), tức vừa không parse được vừa khuyến khích đúng hành vi bịa mà FR-16 cấm; sửa `vendor/` là cấm, mutate `PROMPTS` lúc chạy là đổi prompt bằng side effect, đoán cờ từ văn bản là đặt an toàn lên thứ chốt brief §6 cấm assert. `EngineACL.hoi_dap` (method **mới**, `aquery` giữ nguyên cho `eval/` và `tests/ho_tro_m1.py::hoi`) lấy ngữ cảnh bằng `only_need_context=True` rồi phân ba nhánh: chuỗi bằng `CAU_HONG_UPSTREAM` -> `tu_khoa_rong`; `ngu_canh_rong` -> `ngu_canh_rong` (**không** lời gọi LLM thứ hai); còn lại -> prompt tiếng Việt của `adapters/tra_loi.py` trả JSON hai khóa. **Thứ tự ba nhánh là nội dung, không phải phong cách**: `fail_response` thay cho cả cái khung nên `ngu_canh_rong` đọc nó ra `False`, và hỏi sai thứ tự là một lỗi nội bộ đi thẳng vào một lời gọi LLM trả tiền. **Số lời gọi LLM không đổi (2)** nhưng lý do đổi: lời gọi `:606` của vendor không còn chạy, lời gọi thứ hai là của dự án; lượt từ chối vì ngữ cảnh rỗng tụt xuống **1**, đo trên engine thật với ba adapter thật. `SO_LOI_GOI_LLM_MOI_TRUY_VAN`, `SO_LOI_GOI_EMBEDDING_MOI_TRUY_VAN` và trần 204 giây giữ nguyên. **Envelope từ chối byte-identical**: ba lý do (`ngu_canh_rong`, `co_no_answer`, `tu_khoa_rong`) đi ra qua **đúng một** lời gọi `dung_envelope`, `answer: null` `refused: true` `citations: []` `graph` rỗng `meta` ba trường cũ, và test so `response.content` chứ không so field. Lý do **chỉ** vào audit (`EVENT_REFUSAL`, tầng observation, `chi_tiet.ly_do`) - đó là nguồn duy nhất cho hai cột mà Đo 2 (PRD 5.2) đòi đếm tách. `KetQuaHoiDap` cấm ca "có cả câu trả lời lẫn lý do" **ngay lúc dựng**, nên `refused` suy từ một phép so `None` và không có envelope tự mâu thuẫn. **Lỗi hệ thống khác từ chối**: đầu ra LLM không đọc được là 502 `DAU_RA_LLM_KHONG_DOC_DUOC`, thân lỗi không có khóa `refused`, **và không ghi hàng `refusal` nào** - một hàng ghi kèm ở đó làm hai cột của Đo 2 đếm cả lỗi nội bộ. Bốn ca dội gồm cả `khong_co_dap_an: false` mà `cau_tra_loi` rỗng (cờ tự mâu thuẫn: đoán hộ nó là dựng nhánh thứ tư), và `1` bị từ chối chứ không thành `True`. **Wording chốt kèm ADR-015** (`docs/adr/ADR-015-wording-template-tu-choi-fr-16.md`, đóng action item Epic 3 của sonlm và Open Question 2 của EXPERIENCE.md): giữ nguyên câu đề xuất của spine, ghi ba biến thể đã loại. Hằng `api.hoi_dap.TEMPLATE_TU_CHOI` là bản duy nhất trong code (test quét sáu thư mục), và nó **không** đi vào `answer` - `answer: null` là hợp đồng máy đọc, câu tiếng Việt là hợp đồng tầng render. Khoản ledger duy nhất mang địa chỉ 3-5 đã `resolved` kèm bằng chứng và kèm phần bác lời khai "năm chỗ". **Vòng review đối kháng ba lớp: 0 `intent_gap`, 0 `bad_spec`, 19 khoản `patch` áp hết** (2088 xanh, +14 ca so với bản trước review). **Hai lỗ nặng nhất nằm trong chính prompt mới, và cả hai là lỗ bảo mật thật.** Một, prompt mô tả **sai định dạng dấu che**: nó dạy `[tên_vai: che]` trong khi dấu thật của `core/masking.py` là `[cause:masked]` - không khoảng trắng sau dấu hai chấm, lý do bằng tiếng Anh - nên nó không dặn được gì về `[owner:<tên nhóm thật>]`, và **không luật nào cấm model chép nguyên tên nhóm phụ trách vào `cau_tra_loi`**, tức nhóm rò ra qua `answer` ở endpoint mở nhất của hệ. Ví dụ dấu che nay **dựng từ chính hàm của `core/masking.py`** (`adapters/` được import `core/`) cộng một luật cấm chép mọi chuỗi dạng dấu che, và một test ràng prompt với `dau_che`/`dau_che_owner`/`dau_che_lan_can_khong_khoa` cùng cả bốn `MASK_REASON_*`. Hai, prompt **nói với model rằng ngữ cảnh đã lọc theo quyền của người hỏi**; `cau_tra_loi` là văn bản tự do nên model viết được "phần này bạn không có quyền xem" - đúng phép phân biệt FR-16 dựng ra để bịt, và **phép so byte chỉ phủ lượt từ chối chứ không phủ lượt trả lời**, nên không ca nào khác bắt được. Câu ấy bị bỏ, thay bằng một luật cấm nhắc tới quyền, hạn chế hay việc thiếu dữ liệu; có test chấm prompt không chứa bốn cụm đó. **Bốn lỗ cơ chế còn lại**: `dung_prompt` chèn hai lượt nên hở **chiều ngược** mà bản đầu không thấy - một `<<CAU_HOI>>` nằm trong một tài liệu đã nạp được lượt sau điền câu hỏi vào, tức văn bản tài liệu lái được chỗ câu hỏi rơi (nay một lượt `re.sub` duy nhất, test cả hai chiều); `aquery` trả về thứ **không phải chuỗi** bị `ngu_canh_rong` đếm thành một lượt từ chối *được đo* (nay `NguCanhTruyHoiLa`, lớp con của `DauRaTraLoiKhongDoc` nên cùng một mã 5xx); đường phục vụ **mất phép canh `stream`** vì lời gọi `:606` của vendor - nơi `bo_llm` từng dội `LLMStreamNotSupported` - không còn chạy (nay `hoi_dap` từ chối tường minh trước khi chạm kho); và `_cac_khoi_csv` ghép rào-mở-với-rào-đóng-gần-nhất trong khi **nội dung khối Sources chứa được một dấu rào** (corpus `.md` có khối lệnh có rào), nên một khối bắt đầu bằng một rào bị đọc thành rỗng và cả lượt bị từ chối - nay neo vào **ba nhãn** của khung, có ca test dựng đúng tình huống đó. **Ba lỗ của bộ test**: không ca nào chấm `THAM_SO_LLM` thật sự xuống tới lời gọi (xóa `**THAM_SO_LLM` mà cả bộ test vẫn xanh; với provider thật, mất `response_format` json_object là **mọi** câu trả lời được thành 502) - nay assert trên `llm.kwargs[1]`, và đã chạy lại đột biến để xác nhận nó đỏ; nhánh `tu_khoa_rong` chưa từng chạy qua `kg_query` **thật** (ca cũ monkeypatch chính `aquery`) - nay có thêm một ca dùng engine thật; và bản giả LLM nhận diện lượt bằng chuỗi `khong_co_dap_an`, **một chuỗi người hỏi gõ được vào câu hỏi** - nay dùng `DAU_PROMPT_TRA_LOI`, dòng đầu cố định của prompt. Cộng hàng I/O Matrix "lỗi kho / LLM giữa lượt" nay có ca riêng trong file mới (đường lỗi đã đổi từ `aquery` sang `hoi_dap`), `KetQuaHoiDap` chặn cả câu trả lời **rỗng** chứ không chỉ `None`, và bất đối xứng có chủ đích của `doc_dau_ra` (cờ bật kèm văn bản thì từ chối và bỏ văn bản; cờ tắt kèm văn bản rỗng thì 5xx) được viết ra cùng một test ghim. **Một quyết định phải viết ra vì lý lẽ cũ đã hết đúng (P8)**: `bo_llm` và AGENTS.md đều khai "nơi gọi nằm trong `vendor/kg_query` nên không có chỗ nào gắn một lớp thử lại"; từ 3.5 lời gọi thứ hai nằm trong mã dự án, tức **chỗ gắn đã có**. Quyết định giữ nguyên **không thử lại** - đúng phát biểu đã đóng băng của 3.3 ("một 429 giữa một câu hỏi là 502 ngay") và giữ trần 204 giây không đổi - và cả hai docstring nay nói đó là một lựa chọn. **Hai kênh mà byte-identical không phủ**, nay viết ra ở ADR-015 và ở Design Notes của spec: **thời gian phản hồi** và **số lời gọi LLM** (1 cho `ngu_canh_rong` và `tu_khoa_rong`, 2 cho `co_no_answer`). PRD 5.5 thừa nhận cả hai ngoài mô hình đe dọa, và story cố ý không bù giờ - một `sleep` không san bằng phân phối, nó chỉ dời trung vị. ADR-015 cũng n