  4-2-màn-đăng-nhập-và-vòng-đời-phiên: done  # 07/09/2026, sau vòng review (0 intent_gap / 0 bad_spec, 16 khoản `patch` áp hết). **2564 test xanh dev** (2549 baseline + 15 ca mới của `tests/test_web_khung.py`), 50 deselected, 0 skip. Không chạm `api/`, `core/`, `adapters/`, `vendor/`: story thuần `web/` cộng test. **Luật phân loại lỗi rút ra một chỗ** ở `web/src/api/phien.ts`: `la_het_phien(loi)` đúng khi và chỉ khi `loi.status === 401`, và **chỉ nhánh đó mới được phép** điều hướng tới màn đăng nhập vì một lỗi; 403/5xx/`MANG` báo tại chỗ bằng `HopLoi` và giữ nguyên URL. Hai nghĩa của 401 tách bằng **mã chứ không chỉ status**: `la_sai_thong_tin` đòi cả 401 lẫn `MA_DANG_NHAP_SAI`, nên một 401 hạ tầng (proxy trả thân HTML, `goi.ts` gán mã `MANG`) ra lỗi hệ thống thay vì bảo người dùng gõ sai một mật khẩu đúng. `phien.ts` còn thêm `LY_DO_HET_HAN`, `THAM_SO_LY_DO`, ba hằng `TRUONG_*` cộng `TUYEN_DANG_NHAP` (hợp đồng `/auth/login`), `token_dang_nhap` (thân 200 thiếu `token` là **lỗi hệ thống**; trả bản đã `trim` vì `" abc "` qua được phép kiểm rỗng rồi làm mọi lời gọi sau 401) và `dang_xuat()` (chỉ xóa token, **không gọi API** vì `api/` không có danh sách đen JWT - giới hạn đã nhận ở ADR-022, không phải nợ mới). `/dang-nhap` là màn đứng riêng: `page.tsx` server component bọc `Suspense` quanh `ManDangNhap.tsx` client (bắt buộc, `useSearchParams` làm route thành client-rendered lúc prerender), card 400px bo `rounded.lg` trên nền `surface-app`, thương hiệu `brand-login` màu `primary-deep`, hai ô có `<label htmlFor>` cộng `aria-describedby` khi đỏ, một nút, dòng "Chưa có tài khoản? Liên hệ quản trị viên.", cả màn bọc trong `<main>`. `KhungApp` render **trần** cho `ROUTE_MO` và nhận ra route mở **ngay trong thân render** (`const mo = ROUTE_MO.includes(duong_dan)`), không qua một trạng thái khởi tạo rồi đợi `useEffect` lật lại - vòng qua effect là một nháy khung đầy đủ trước card mà `toHaveCount(0)` của Playwright tự chờ nên không thấy. Biến thể `"mo"` bỏ khỏi union `TrangThai`